services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - labscript-net
      - db-net # network eksternal tempat Postgres jalan

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - labscript-net

networks:
  labscript-net:
    driver: bridge
  db-net:
    external: true
    name: database_db-network
